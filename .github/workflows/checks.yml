name: Site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: links and images exist, one link to the original hub per page,
      # generated pages match the generators, no untranslated Russian, balanced HTML.
      - run: python tools/check_site.py
